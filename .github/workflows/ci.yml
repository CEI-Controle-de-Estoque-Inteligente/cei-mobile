name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Resumo de cobertura
        run: |
          total=$(grep -c "^DA:" coverage/lcov.info || true)
          hit=$(grep "^DA:" coverage/lcov.info | grep -vc ",0$" || true)
          echo "Linhas cobertas: $hit de $total" >> "$GITHUB_STEP_SUMMARY"
